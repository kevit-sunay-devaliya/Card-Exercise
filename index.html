<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card - Exercise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <img class="card-image" src="./images/image.jpg" alt="Post Image" />
      </div>
      <div class="card-body">
        <p class="card-time">1 week ago</p>
        <h2 class="card-title">Post Two</h2>
        <p class="card-text">
          Lorem ipsum dolor, sit amet consectetur adipisicing elit. Explicabo
          excepturi voluptas delectus accusantium, libero corporis laborum
          impedit.
        </p>
      </div>
      <div class="card-footer">
        <div class="footer-item">
          <p class="footer-number">7<sup>m</sup></p>
          <p class="footer-label">READ</p>
        </div>
        <div class="footer-item">
          <p class="footer-number">7152</p>
          <p class="footer-label">VIEWS</p>
        </div>
        <div class="footer-item">
          <p class="footer-number">21</p>
          <p class="footer-label">COMMENTS</p>
        </div>
      </div>
    </div>
  </body>
</html>
